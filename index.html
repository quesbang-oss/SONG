<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
/>

<meta name="theme-color" content="#05040a" />

<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./manifest.json" />

<title>ゆくコミュソングバトル - YUKU COMMU SONG BATTLE</title>

<style>
  html,
  body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    /* スクロールによるゲーム中のカクつきを防止 */
    overscroll-behavior: none;

    /* タッチ操作をゲーム側に渡す */
    touch-action: none;
  }

  #app {
    width: 100%;
    height: 100%;
    overflow: hidden;
    touch-action: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;

    /* ブラウザのスワイプ・スクロールを防止 */
    touch-action: none;
  }

  /* 共有ボタン */
  #share-game-button {
    position: fixed;
    top: 12px;
    right: 12px;

    z-index: 9999;

    padding: 9px 14px;

    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 10px;

    background: rgba(5, 4, 10, 0.85);
    color: #fff;

    font-size: 14px;
    font-weight: bold;

    cursor: pointer;

    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);

    touch-action: manipulation;
  }

  #share-game-button:active {
    transform: scale(0.95);
  }

  /* スマホでは少し大きく */
  @media (max-width: 600px) {
    #share-game-button {
      top: 10px;
      right: 10px;

      padding: 11px 15px;

      font-size: 14px;
    }
  }
</style>
</head>

<body>

  <div id="app">

    <canvas id="game-canvas"></canvas>

    <div id="ui-root"></div>

    <div id="toast-root"></div>

  </div>

  <!-- 友達に共有 -->
  <button
    id="share-game-button"
    type="button"
    aria-label="ゲームを友達に共有"
  >
    ↗ 共有
  </button>

  <script type="module" src="./src/main.js"></script>

  <script>
    /*
     * Service Worker
     */
    if (
      'serviceWorker' in navigator &&
      (
        location.protocol === 'https:' ||
        location.hostname === 'localhost'
      )
    ) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js')
          .catch(() => {});
      });
    }


    /*
     * 友達に共有
     */
    const shareButton =
      document.getElementById('share-game-button');

    shareButton.addEventListener('click', async () => {

      const shareData = {
        title: 'ゆくコミュソングバトル',
        text: 'この音ゲー遊んでみて！',
        url: window.location.href
      };

      try {

        /*
         * スマホ・対応ブラウザ
         * → LINE、Discord、メールなどの
         *   OS標準共有メニューを開く
         */
        if (navigator.share) {
          await navigator.share(shareData);
          return;
        }

        /*
         * PCなどでWeb Share APIがない場合
         * → URLをコピー
         */
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(
            window.location.href
          );

          alert('ゲームURLをコピーしました！');
          return;
        }

        /*
         * 最終フォールバック
         */
        const input = document.createElement('input');

        input.value = window.location.href;

        document.body.appendChild(input);

        input.select();

        document.execCommand('copy');

        input.remove();

        alert('ゲームURLをコピーしました！');

      } catch (error) {

        /*
         * 共有メニューをキャンセルした場合は
         * エラー表示しない
         */
        if (error?.name === 'AbortError') {
          return;
        }

        console.error(
          '共有に失敗しました:',
          error
        );
      }
    });
  </script>

</body>
</html>
